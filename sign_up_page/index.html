<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- This helps the page fit better on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up Page</title>

    <!-- Bootstrap makes the form look nicer without doing everything from scratch -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- My own CSS file for extra styling -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Main page wrapper -->
    <div class="container mt-5 mb-5">

        <!-- Main form card -->
        <div class="card shadow-lg signup-card">

            <!-- Header area -->
            <div class="card-header text-center signup-header">
                <h1>Sign Up Form</h1>
                <p>Create your account below</p>
            </div>

            <!-- Form body -->
            <div class="card-body">

                <!-- This form goes to welcome.html only if JavaScript validation passes -->
                <form id="signupForm" action="welcome.html">

                    <!-- First name textbox -->
                    <div class="mb-3">
                        <label for="fName" class="form-label">First Name:</label>
                        <input type="text" id="fName" name="fName" class="form-control">
                    </div>

                    <!-- Last name textbox -->
                    <div class="mb-3">
                        <label for="lName" class="form-label">Last Name:</label>
                        <input type="text" id="lName" name="lName" class="form-control">
                    </div>

                    <!-- Gender radio buttons -->
                    <div class="mb-3">
                        <p class="form-label">Gender:</p>

                        <!-- These radio buttons use the same name so only one can be picked -->
                        <label class="me-3">
                            <input type="radio" name="gender" value="m"> Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="f"> Female
                        </label>
                    </div>

                    <!-- Zip code textbox -->
                    <div class="mb-3">
                        <label for="zip" class="form-label">Zip Code:</label>
                        <input type="text" id="zip" name="zip" class="form-control">

                        <!-- This shows an error next to the zip code area if the zip is not found -->
                        <span id="zipError" class="message"></span>
                    </div>

                    <!-- City info returned by the zip code API -->
                    <div class="location-box mb-3">
                        <p>City: <span id="city"></span></p>
                        <p>Latitude: <span id="latitude"></span></p>
                        <p>Longitude: <span id="longitude"></span></p>
                    </div>

                    <!-- State dropdown loaded from the API -->
                    <div class="mb-3">
                        <label for="state" class="form-label">State:</label>
                        <select id="state" name="state" class="form-select">
                            <option value="">Loading states...</option>
                        </select>
                    </div>

                    <!-- County dropdown updated after selecting a state -->
                    <div class="mb-3">
                        <label for="county" class="form-label">Select a County:</label>
                        <select id="county" name="county" class="form-select">
                            <option value="">Select a state first</option>
                        </select>
                    </div>

                    <!-- Desired username textbox -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Desired Username:</label>
                        <input type="text" id="username" name="username" class="form-control">

                        <!-- This shows if the username is available or taken -->
                        <span id="usernameError" class="message"></span>
                    </div>

                    <!-- Password textbox -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" id="password" name="password" class="form-control">

                        <!-- This shows the suggested password when the password box is clicked -->
                        <span id="suggestedPassword" class="message"></span>
                    </div>

                    <!-- Password confirmation textbox -->
                    <div class="mb-3">
                        <label for="passwordAgain" class="form-label">Type Password Again:</label>
                        <input type="password" id="passwordAgain" name="passwordAgain" class="form-control">

                        <!-- This shows password validation errors -->
                        <span id="passwordError" class="message"></span>
                    </div>

                    <!-- Submit button -->
                    <div class="text-center">
                        <button class="btn btn-primary btn-lg">Sign up!</button>
                    </div>

                </form>

            </div>
        </div>

        <!-- Footer similar to earlier labs -->
        <footer class="text-center mt-4 footer-box">
            <p>Sarza | Internet Programming | CSUMB</p>
            <img src="img/csumb_logo.png" alt="CSUMB Logo" class="csumb-logo">
        </footer>

    </div>

    <!-- Linking the JavaScript file so the form can become interactive -->
    <script src="js/script.js"></script>

</body>
</html>
